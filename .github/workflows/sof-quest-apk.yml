# Builds the SoF Quest APK (Soldier of Fortune on the Quake2Quest engine).
#
# The Raven SoF SDK comes from the sof-sdk branch of this repository (sof-sdk-master.zip), or
# from SOF_SDK_URL (secret or variable) when that is set. The 64-bit port patch is
# tools/sof/sdk/sof-sdk-64bit.patch (or SOF_PATCH_URL).
#
# It runs on every push to the SoF branch (and can be started by hand once the file is on the
# default branch); the APK is attached to the run as an artifact.
name: SoF Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ sof-bsp46-m32 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAVE_SDK: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: sof-sdk
          path: sofsdk-branch

      - uses: actions/setup-java@v4
        if: env.HAVE_SDK == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and NDK
        if: env.HAVE_SDK == 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > Projects/Android/local.properties

      - name: Khronos OpenXR loader (gitignored upstream)
        run: |
          DST=Projects/Android/jni/AndroidPrebuilt/jni/libopenxr_loader.so
          test -f "$DST" && exit 0
          M=https://repo1.maven.org/maven2/org/khronos/openxr/openxr_loader_for_android
          V=1.1.59
          curl -fsSL "$M/$V/openxr_loader_for_android-$V.aar" -o loader.aar || {
            V=$(curl -fsSL "$M/maven-metadata.xml" | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
            curl -fsSL "$M/$V/openxr_loader_for_android-$V.aar" -o loader.aar; }
          echo "OpenXR loader $V"
          mkdir loader && unzip -q loader.aar -d loader
          cp "$(find loader -path '*arm64-v8a*' -name libopenxr_loader.so | head -1)" "$DST"

      - name: SoF SDK with the 64-bit patch
        if: env.HAVE_SDK == 'true'
        env:
          SOF_SDK_URL: ${{ secrets.SOF_SDK_URL || vars.SOF_SDK_URL }}
          SOF_PATCH_URL: ${{ secrets.SOF_PATCH_URL }}
        run: |
          if [ -n "$SOF_SDK_URL" ]; then
            curl -fsSL "$SOF_SDK_URL" -o sofsdk.zip
          else
            cp sofsdk-branch/sof-sdk-master.zip sofsdk.zip
          fi
          mkdir sofsdk && unzip -q sofsdk.zip -d sofsdk
          GAME=$(find "$PWD/sofsdk" -type d -name gamecpp | head -1 | xargs dirname)
          test -d "$GAME" || { echo "::error::no Source/Game in the SDK zip"; exit 1; }
          PATCH=tools/sof/sdk/sof-sdk-64bit.patch
          if [ ! -f "$PATCH" ]; then
            test -n "$SOF_PATCH_URL" || { echo "::error::no patch: commit $PATCH or set SOF_PATCH_URL"; exit 1; }
            curl -fsSL "$SOF_PATCH_URL" -o sof-sdk-64bit.patch
            PATCH=sof-sdk-64bit.patch
          fi
          PATCH=$(realpath "$PATCH")
          (cd "$(dirname "$GAME")" && patch -p1 --forward < "$PATCH" > patch.log) || { grep -iE "fail|reject|can't" "$(dirname "$GAME")/patch.log" | head -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          echo "SOF_GAME=$GAME" >> "$GITHUB_ENV"

      - name: Build
        if: env.HAVE_SDK == 'true'
        working-directory: Projects/Android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease -PsofSdk="$SOF_GAME" -PndkKeepGoing 2>&1 | tee build.log; then
            # surface the first compiler/linker errors as annotations (readable without the log)
            { grep -A25 "What went wrong" build.log | head -60; grep -E "error:|Error |undefined reference|\*\*\*" build.log | head -40; } > errs.txt || true
            while IFS= read -r l; do echo "::error::${l:0:900}"; done < errs.txt
            exit 1
          fi

      - name: Publish the build log to the ci-logs branch
        if: always()
        run: |
          LOG=$PWD/Projects/Android/build.log
          test -f "$LOG" || exit 0
          D=$(mktemp -d); cd "$D"
          git init -q && git checkout -q -b ci-logs
          cp "$LOG" build.log
          echo "${{ github.sha }} ${{ job.status }}" > STATUS
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -q -m "log ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - uses: actions/upload-artifact@v4
        if: env.HAVE_SDK == 'true'
        with:
          name: SoFQuest-apk
          path: Projects/Android/build/outputs/apk/release/*.apk
