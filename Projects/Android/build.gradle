buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace "com.drbeef.quake2quest"
    // compileSdk must stay >= 30 so the All-Files-Access APIs (Environment.isExternalStorageManager,
    // Build.VERSION_CODES.R, ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION) used in
    // GLES3JNIActivity compile. targetSdk is intentionally kept lower (see below).
    compileSdk 34
    ndkVersion "26.1.10909125"

    project.archivesBaseName = "quake2quest"

    packaging {
        jniLibs {
            keepDebugSymbols += "**/*.so"
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId "com.drbeef." + project.archivesBaseName
        minSdk 29
        // Kept at 29 so requestLegacyExternalStorage is honoured and storage behaviour stays
        // consistent across Quest/Pico. Raising compileSdk above does not change runtime behaviour.
        targetSdk 29

        ndk {
            abiFilters 'arm64-v8a'
        }

        // Soldier of Fortune build (-PsofSdk=...): separate app id, name and data folder
        def sofBuild = project.hasProperty('sofSdk')
        buildConfigField "boolean", "SOF", sofBuild ? "true" : "false"
        buildConfigField "String", "DATA_DIR", sofBuild ? '"/sdcard/SoFQuest"' : '"/sdcard/Quake2Quest"'
        manifestPlaceholders = [appLabel: sofBuild ? "SoF Quest" : "@string/quake2quest"]
        if (sofBuild) {
            applicationIdSuffix ".sof"
        }

        externalNativeBuild {
            ndkBuild {
                def numProcs = Runtime.runtime.availableProcessors()
                arguments "V=0", "-j$numProcs"
                // Soldier of Fortune build: ./gradlew assembleDebug -PsofSdk=/path/to/ported/sdk/Game
                if (project.hasProperty('sofSdk')) {
                    arguments "SOF=1", "SOF_SDK_DIR=" + new File(project.getProperty('sofSdk')).absolutePath
                }
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('jni/Android.mk')
        }
    }

    signingConfigs {
        def keystorePath = (project.hasProperty('key.store')) ?
                new File(project.getProperty('key.store')) :
                project.file('android.debug.keystore')

        def keystorePassword = (project.hasProperty('key.store.password')) ?
                project.getProperty('key.store.password') : 'android'

        def keystoreKeyAlias = (project.hasProperty('key.alias')) ?
                project.getProperty('key.alias') : 'androiddebugkey'

        def keystoreKeyPassword = (project.hasProperty('key.alias.password')) ?
                project.getProperty('key.alias.password') : 'android'

        debug {
            storeFile keystorePath
            storePassword keystorePassword
            keyAlias keystoreKeyAlias
            keyPassword keystoreKeyPassword
            v2SigningEnabled true
        }

        release {
            storeFile keystorePath
            storePassword keystorePassword
            keyAlias keystoreKeyAlias
            keyPassword keystoreKeyPassword
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            jniDebuggable true
            externalNativeBuild {
                ndkBuild {
                    arguments "NDK_DEBUG=1", "USE_ASAN=1"
                }
            }
        }

        release {
            signingConfig signingConfigs.release
            debuggable false
            jniDebuggable false
            minifyEnabled false
            externalNativeBuild {
                ndkBuild {
                    arguments "NDK_DEBUG=0", "USE_ASAN=0"
                }
            }
        }
    }

    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['../../java']
        jniLibs.srcDirs = ['libs']
        res.srcDirs = ['../../res']
        assets.srcDirs = ['../../assets']
        jni.srcDirs = ['jni']
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "com.android.support:support-compat:28.0.0"
    implementation "com.android.support:support-core-utils:28.0.0"
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
